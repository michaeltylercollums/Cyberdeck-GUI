conky.config = {
    alignment = 'top_right',
    gap_x = 25,
    gap_y = 45,
    minimum_width = 280,
    update_interval = 1.5,
    double_buffer = true,
    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    draw_shades = false,
    use_xft = true,
    font = 'DejaVu Sans:size=9',
    default_color = 'white',
    color1 = '00FFAA', -- Accent color
};

conky.text = [[
${color1}${font DejaVu Sans:bold:size=11}SYSTEM MONITOR${font}${color}
${hr 1}
${color1}Uptime:${color} $uptime
${color1}Freq:${color} ${freq_g} GHz @ ${execi 2 awk '{printf "%.1f°C", $1/1000}' /sys/class/thermal/thermal_zone0/temp}

${color1}CPU Usage:${color} ${cpu}%
${cpubar 6}

${color1}RAM Usage:${color} $mem / $memmax ($memperc%)
${membar 6}

${color1}${font DejaVu Sans:bold:size=10}NETWORK (${font DejaVu Sans:size=9}wlan0${font})${color}
${hr 1}
Down: ${downspeed wlan0}/s ${alignr}Up: ${upspeed wlan0}/s
${downspeedgraph wlan0 25,130} ${alignr}${upspeedgraph wlan0 25,130}
]];
